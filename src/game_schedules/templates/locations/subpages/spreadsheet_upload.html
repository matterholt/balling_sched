<!doctype html>
<html>
  <head>
    <title>Upload CSV</title>
  </head>
  <body>
    <h1>Upload CSV</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Upload</button>
    </form>

    {% if messages %}
    <div>
      <a href="{% url 'locations_list' %}">All Venues</a>

      <ul>
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}
  </body>
</html>
