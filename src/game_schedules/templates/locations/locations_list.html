{% extends "../base.html" %} {% load partials %} {% block content %}
<h1>Venues</h1>
<div>
  <a href="{%url 'index'%}">Main</a>
</div>
<div class="page_actions">
  <a href="{% url 'spreadsheet_upload' %}">Upload file</a>
  <a href="{% url 'create_location' %}">New Location</a>

  <!--{% include "locations/partials/new_location_form.html#location_form" %}-->

  <ul id="venue-list">
    {% for venue in locations %}
    <div class="vunue_list-item" id="venue-{{ venue.pk }}">
      <li>{{ venue.name }} - {{ venue.city }}, {{ venue.state }}</li>
      <button
        hx-delete="{% url 'delete_location_entry' venue.pk %}"
        hx-target="venue-{{ venue.pk }"
        hx-swap="outerHTML"
      >
        delete {{venue.pk}}
      </button>
    </div>

    {% endfor %}
  </ul>
</div>
{% load static %}
<script src="{% static 'script.js' %}"></script>
{%endblock%}
