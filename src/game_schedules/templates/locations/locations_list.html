{% extends "../base.html" %} {% block content %}
<h1>Venues</h1>
<div>
  <a href="{%url 'index'%}">Main</a>
</div>
<div class="page_actions">
  <a href="{% url 'spreadsheet_upload' %}">Upload file</a>
  <div></div>
  <div id="dialog"></div>
  <p>below</p>
  <button
    hx-get="{% url 'create_location' %}"
    hx-target="#dialog"
    hx-swap="innerHTML"
  >
    Add Venue 3
  </button>
  <p>above</p>

  <ul id="venue-list">
    {% for venue in locations %}
    <div class="vunue_list-item" id="venue-{{ venue.pk }}">
      <li>{{ venue.name }} - {{ venue.city }}, {{ venue.state }}</li>
      <button
        hx-delete="{% url 'delete_location_entry' venue.pk %}"
        hx-target="#venue-{{ venue.pk }}"
        hx-swap="outerHTML"
      >
        delete {{venue.pk}}
      </button>
    </div>

    {% endfor %}
  </ul>
</div>
{% load static %}
<script src="{% static 'script.js' %}"></script>
{%endblock%}
