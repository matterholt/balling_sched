<div
    id="tasks"
    hx-confirm="Are you sure you want to delete this task?"
    hx-target="#tasks"
    hx-swap="outerHTML"
>
    {% for task in tasks %}
    <div>
        {{ forloop.counter }} {{ task.title }}
        <a class="block mr-2 hover:text-gray-600"> Delete? </a>
    </div>
    {% endfor %}
</div>
