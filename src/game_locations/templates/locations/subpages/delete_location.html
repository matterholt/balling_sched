{% extends "../../base.html" %} {% block content %}
<div class="container">
  <h2>Confirm Delete</h2>
  <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'locations_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
